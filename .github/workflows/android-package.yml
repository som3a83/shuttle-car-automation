name: Package Android Debug APK

on:
  push:
    branches:
      - main
      - 'development/**'
      - 'feature/v7-modernization'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shuttle-android-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-apk:
    name: Android Debug APK Packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate web application
        run: |
          npm run check
          npm test
          npm run check:release
          npm run assets:render
          npm run build

      - name: Generate Android project and branded assets
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#111820' --iconBackgroundColorDark '#111820' --splashBackgroundColor '#111820' --splashBackgroundColorDark '#111820'

      - name: Stamp V7 development version
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const run = Number(process.env.GITHUB_RUN_NUMBER);
          if (!Number.isSafeInteger(run) || run < 1) throw new Error('Invalid GitHub run number');
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (!/^7\\.0\\.0-dev\\.1$/.test(version)) throw new Error('Unexpected V7 package version: ' + version);
          const versionCode = 7000000 + run;
          const file = 'android/app/build.gradle';
          let gradle = fs.readFileSync(file, 'utf8');
          if (!/\\bversionCode\\s+\\d+/.test(gradle) || !/\\bversionName\\s+['"][^'"]+['"]/.test(gradle)) {
            throw new Error('Android Gradle version fields were not found');
          }
          gradle = gradle.replace(/(\\bversionCode\\s+)\\d+/, '$1' + versionCode);
          gradle = gradle.replace(/(\\bversionName\\s+)['"][^'"]+['"]/, '$1"' + version + '"');
          fs.writeFileSync(file, gradle);
          if (!gradle.includes('versionCode ' + versionCode) || !gradle.includes('versionName "' + version + '"')) {
            throw new Error('Android V7 version stamp did not verify');
          }
          console.log('Android development build: ' + version + ' (' + versionCode + ')');
          NODE

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK and generate checksum
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p artifacts/android-package
          cp "$APK" artifacts/android-package/shuttle-car-automation-v7.0.0-dev.1-debug.apk
          sha256sum artifacts/android-package/shuttle-car-automation-v7.0.0-dev.1-debug.apk > artifacts/android-package/SHA256SUMS.txt
          ls -lh artifacts/android-package/

      - name: Publish installable Android APK
        uses: actions/upload-artifact@v7
        with:
          name: shuttle-car-automation-v7.0.0-dev.1-debug-apk
          path: artifacts/android-package/
          if-no-files-found: error
          retention-days: 30
