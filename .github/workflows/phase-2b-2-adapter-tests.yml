name: Phase 2B-2 Adapter Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/storage/adapters/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - chatgpt/phase-2b-2-storage-adapters

permissions:
  contents: read

jobs:
  adapter-tests:
    name: Storage adapter tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run adapter tests
        run: npx vitest run src/storage/adapters/
