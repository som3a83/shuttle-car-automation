name: Apply verified engineering upgrade
on:
  push:
    branches:
      - engineering/industrial-ui-security-v1
    paths:
      - engineering/upgrade/APPLY
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engineering/industrial-ui-security-v1
          fetch-depth: 0
      - name: Validate and apply the prepared source patch
        shell: bash
        run: |
          set -euo pipefail
          test -f engineering/upgrade/SHA256
          cat engineering/upgrade/part-*.b64 | base64 --decode > /tmp/upgrade.patch.gz
          cd engineering/upgrade
          sha256sum --check SHA256
          cd ../..
          gzip --decompress --stdout /tmp/upgrade.patch.gz > /tmp/upgrade.patch
          git apply --check /tmp/upgrade.patch
          git apply /tmp/upgrade.patch
          rm -rf engineering/upgrade
          rm .github/workflows/apply-engineering-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: add local identity, audit integrity and verified storage"
          git push origin HEAD:engineering/industrial-ui-security-v1
