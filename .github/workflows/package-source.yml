name: Package Complete Project Source

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/package-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-archive:
    name: Create complete source ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create source archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          REVISION="$(git rev-parse HEAD)"
          REVISION_SHORT="$(git rev-parse --short=12 HEAD)"
          mkdir -p release-files
          git archive --format=zip --prefix="shuttle-car-automation-$REVISION_SHORT/" HEAD -o release-files/shuttle-car-automation-source.zip
          cd release-files
          sha256sum shuttle-car-automation-source.zip > shuttle-car-automation-source.zip.sha256
          printf '%s\n' "$REVISION" > source-commit.txt

      - name: Publish complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-car-automation-complete-source
          path: |
            release-files/shuttle-car-automation-source.zip
            release-files/shuttle-car-automation-source.zip.sha256
            release-files/source-commit.txt
          if-no-files-found: error
          retention-days: 30
