name: Phase 2B-1 Storage Tests

on:
  push:
    branches:
      - chatgpt/phase-2b-1-storage-core-2026-11-17
  pull_request:
    # PR #38 targets the Phase 2A branch so it can inherit its changes without duplicating them.
    branches: [main, chatgpt/phase-2a-quick-wins-2026-11-17]
    paths:
      - 'src/storage/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/storage/__tests__/index.test.ts
