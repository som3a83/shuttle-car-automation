name: Phase 2B-1 Storage Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/storage/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/storage/__tests__/index.test.ts
