name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - "development/**"
      - "copilot/**"
      - "industrial/**"
      - "feat/mobile-immersive-3d-v6-20261119"
  pull_request:
    branches:
      - main
      - "development/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shuttle-android-smoke-${{ github.ref }}
  # Only the newest commit on a PR branch needs an emulator run; cancel stale queued/running builds.
  cancel-in-progress: true

jobs:
  build-android:
    name: Android Debug APK & Emulator Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$HOME/Android/Sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          # sdkmanager closes stdin after accepting all licenses; yes may receive SIGPIPE.
          # Keep the final sdkmanager exit code while avoiding a false pipeline failure.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate web application
        run: |
          npm run check
          npm test
          npm run check:release
          npm run assets:render
          npm run build

      - name: Capture every application screen at mobile, tablet and desktop sizes
        run: |
          set -euo pipefail
          npx playwright install --with-deps chrome
          npm run preview -- --host 127.0.0.1 > /tmp/shuttle-vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          npm run screenshots
      - name: Upload responsive screen review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shuttle-v8-responsive-screen-review
          path: artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate Android project and branded assets
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#111820' --iconBackgroundColorDark '#111820' --splashBackgroundColor '#111820' --splashBackgroundColorDark '#111820'

      - name: Stamp traceable development version
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const run = Number(process.env.GITHUB_RUN_NUMBER);
          if (!Number.isSafeInteger(run) || run < 1) throw new Error('Invalid GitHub run number');
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (version !== '8.0.0') throw new Error('Unexpected V8 package version: ' + version);
          const versionCode = 8000000 + run;
          const file = 'android/app/build.gradle';
          let gradle = fs.readFileSync(file, 'utf8');
          if (!/\bversionCode\s+\d+/.test(gradle) || !/\bversionName\s+['"][^'"]+['"]/.test(gradle)) {
            throw new Error('Android Gradle version fields were not found');
          }
          gradle = gradle.replace(/(\bversionCode\s+)\d+/, '$1' + versionCode);
          gradle = gradle.replace(/(\bversionName\s+)['"][^'"]+['"]/, '$1"' + version + '"');
          fs.writeFileSync(file, gradle);
          if (!gradle.includes('versionCode ' + versionCode) || !gradle.includes('versionName "' + version + '"')) {
            throw new Error('Android development version stamp did not verify');
          }
          console.log('Android V8 development build: ' + version + ' (' + versionCode + ')');
          NODE
      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable Android emulator hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::The GitHub Actions runner does not expose /dev/kvm; accelerated Android emulator testing is unavailable."
            exit 1
          fi
          echo "Runner identity: $(id)"
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          echo "KVM access enabled for the ephemeral CI runner."
          ls -l /dev/kvm

      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 18
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        with:
          api-level: 35
          system-image-api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim
          disable-animations: true
          script: >-
            bash "$GITHUB_WORKSPACE/scripts/android-emulator-smoke.sh"
      - name: Upload Android emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shuttle-android-emulator-evidence
          path: artifacts/android-smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shuttle-car-automation-v8.0.0-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14
