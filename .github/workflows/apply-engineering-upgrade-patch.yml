name: Apply verified engineering upgrade patch
on:
  push:
    branches:
      - engineering/industrial-ui-security-v1
    paths:
      - engineering-upgrade.patch.gz.b64
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the engineering branch
        uses: actions/checkout@v4
        with:
          ref: engineering/industrial-ui-security-v1
          fetch-depth: 0
      - name: Verify and apply the prepared source patch
        shell: bash
        run: |
          set -euo pipefail
          test -f engineering/upgrade/SHA256
          cat engineering/upgrade/part-*.b64 | tr -d '\n' | base64 --decode > /tmp/upgrade.patch.gz
          expected="$(tr -d '\n' < engineering/upgrade/SHA256)"
          actual="$(sha256sum /tmp/upgrade.patch.gz | cut -d ' ' -f 1)"
          test "$actual" = "$expected"
          gzip --decompress --stdout /tmp/upgrade.patch.gz > /tmp/upgrade.patch
          git apply --check /tmp/upgrade.patch
          git apply /tmp/upgrade.patch
          rm -rf engineering/upgrade engineering-upgrade.patch.gz.b64
          rm .github/workflows/apply-engineering-upgrade-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: add local identity, audit integrity and verified storage"
          git push origin HEAD:engineering/industrial-ui-security-v1
