name: Personal Android Unsigned Release APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_name:
        description: Personal release version
        required: true
        default: 8.0.0
        type: string
      version_code:
        description: Positive Android versionCode
        required: true
        default: "8000000"
        type: string

permissions:
  contents: write

concurrency:
  group: android-personal-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-personal-release:
    name: Validate and build unsigned personal APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install and validate web application
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npm run check:release
          npm run assets:render
          npm run build

      - name: Generate Android project, network inspector and branded assets
        run: |
          npx cap add android
          node scripts/install-android-network-inspector.mjs
          npx capacitor-assets generate --android --iconBackgroundColor '#111820' --iconBackgroundColorDark '#111820' --splashBackgroundColor '#111820' --splashBackgroundColorDark '#111820'
          npx cap sync android

      - name: Stamp personal release version without signing configuration
        env:
          APP_VERSION_INPUT: ${{ inputs.version_name || '8.0.0' }}
          APP_VERSION_CODE_INPUT: ${{ inputs.version_code || '8000000' }}
        run: node scripts/prepare-android-personal-release.mjs

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify package identity and publish unsigned APK
        shell: bash
        env:
          APP_VERSION_INPUT: ${{ inputs.version_name || '8.0.0' }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          BADGING="$( "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" )"
          grep -q "package: name='com.shuttlecar.automation'" <<< "$BADGING"
          mkdir -p artifacts/personal-release
          cp "$APK" "artifacts/personal-release/shuttle-car-automation-${APP_VERSION_INPUT}-unsigned.apk"
          printf 'Version: %s\nCommit: %s\nSigning: UNSIGNED\n' "$APP_VERSION_INPUT" "$GITHUB_SHA" > artifacts/personal-release/BUILD-INFO.txt
          sha256sum artifacts/personal-release/*.apk > artifacts/personal-release/SHA256SUMS.txt
          ls -lh artifacts/personal-release/

      - name: Upload unsigned personal APK
        uses: actions/upload-artifact@v7
        with:
          name: shuttle-car-automation-personal-unsigned-apk
          path: artifacts/personal-release/
          if-no-files-found: error
          retention-days: 90

