name: Android Play Store AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Semantic app version (for example 1.0.0)
        required: true
        default: 1.0.0
        type: string
      version_code:
        description: Android versionCode; must increase on every Play upload
        required: true
        default: "1000000"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-play-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Android Play AAB Release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and validate web application
        run: |
          npm install --no-audit --no-fund
          npx tsc -b
          npm test
          npm run check:release
          npm run assets:render
          npm run build

      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#111820' --iconBackgroundColorDark '#111820' --splashBackgroundColor '#111820' --splashBackgroundColorDark '#111820'
          npx cap sync android

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Configure ANDROID_KEYSTORE_BASE64 and the other signing secrets before running a Play release."; exit 1; }
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-key.jks
          test -s android/app/upload-key.jks

      - name: Enforce Play release SDK, version and signing configuration
        env:
          APP_VERSION_INPUT: ${{ inputs.version_name }}
          APP_VERSION_CODE_INPUT: ${{ inputs.version_code || '1000000' }}
          ANDROID_KEYSTORE_FILE: upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export APP_VERSION="${GITHUB_REF_NAME#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$APP_VERSION"
            export APP_VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          else
            export APP_VERSION="$APP_VERSION_INPUT"
            export APP_VERSION_CODE="$APP_VERSION_CODE_INPUT"
          fi
          node scripts/prepare-android-release.mjs

      - name: Build release Android App Bundle
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      - name: Verify signature and generate checksum
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" > /tmp/aab-signature-check.txt
          grep -qi "jar verified" /tmp/aab-signature-check.txt
          mkdir -p artifacts/play-release
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="$APP_VERSION_INPUT"
          fi
          cp "$AAB" "artifacts/play-release/shuttle-car-automation-${RELEASE_VERSION}.aab"
          sha256sum artifacts/play-release/*.aab > artifacts/play-release/SHA256SUMS.txt
          ls -lh artifacts/play-release
        env:
          APP_VERSION_INPUT: ${{ inputs.version_name || '1.0.0' }}

      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-car-automation-play-aab
          path: artifacts/play-release/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/play-release/*
          generate_release_notes: true
