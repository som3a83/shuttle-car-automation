name: Shuttle Car Automation CI

on:
  push:
    branches:
      - main
      - "development/**"
      - "copilot/**"
  pull_request:
    branches:
      - main
      - "development/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shuttle-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: TypeScript, tests, and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript project check
        run: npm run check

      - name: Run automated tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Render store listing artwork and PWA icons
        run: npm run assets:render

      - name: Upload Google Play listing artwork
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-car-automation-store-artwork
          path: artifacts/store-listing/
          if-no-files-found: error
          retention-days: 30
