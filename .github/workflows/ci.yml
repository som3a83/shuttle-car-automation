name: Shuttle Car Automation CI

on:
  push:
    branches:
      - "development/**"
      - "copilot/**"
  pull_request:
    branches:
      - "development/shuttle-car-automation-v6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shuttle-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: TypeScript, tests, and production build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript project check
        run: npx tsc -b

      - name: Run automated tests
        run: npm test

      - name: Build production bundle
        run: npm run build
