name: Build V8 Android APK from source archive

on:
  push:
    branches: [main]
    paths:
      - "Shuttle-Car-Automation-V8.0.0-Source.zip"
      - ".github/workflows/build-v8-from-source-archive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shuttle-v8-archive-build
  cancel-in-progress: true

jobs:
  build:
    if: hashFiles('Shuttle-Car-Automation-V8.0.0-Source.zip') != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract V8 source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q Shuttle-Car-Automation-V8.0.0-Source.zip -d extracted
          test -f extracted/final_work/package.json
          test -f extracted/final_work/package-lock.json
          test -f extracted/final_work/capacitor.config.ts
          test "$(node -p "require('./extracted/final_work/package.json').version")" = "8.0.0"

      - name: Install dependencies
        working-directory: extracted/final_work
        run: npm ci --no-audit --no-fund

      - name: Run checks and build web app
        working-directory: extracted/final_work
        run: |
          npm run check
          npm test
          npm run check:release
          npm run assets:render
          npm run build

      - name: Install Android platform
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Android project and app assets
        working-directory: extracted/final_work
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#111820' --iconBackgroundColorDark '#111820' --splashBackgroundColor '#111820' --splashBackgroundColorDark '#111820'
          npx cap sync android

      - name: Stamp V8 build version
        working-directory: extracted/final_work
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (version !== '8.0.0') throw new Error('Expected V8.0.0, found ' + version);
          const run = Number(process.env.GITHUB_RUN_NUMBER);
          const versionCode = 8000000 + run;
          const file = 'android/app/build.gradle';
          let gradle = fs.readFileSync(file, 'utf8');
          if (!/\bversionCode\s+\d+/.test(gradle) || !/\bversionName\s+['"][^'"]+['"]/.test(gradle)) {
            throw new Error('Android version fields missing from generated Gradle file');
          }
          gradle = gradle.replace(/(\bversionCode\s+)\d+/, '$1' + versionCode);
          gradle = gradle.replace(/(\bversionName\s+)['"][^'"]+['"]/, '$1"' + version + '"');
          fs.writeFileSync(file, gradle);
          console.log('Stamped V' + version + ', versionCode ' + versionCode);
          NODE

      - name: Build debug APK
        working-directory: extracted/final_work/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK and create checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="extracted/final_work/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/shuttle-car-automation-v8.0.0-debug.apk
          sha256sum artifacts/shuttle-car-automation-v8.0.0-debug.apk > artifacts/SHA256SUMS.txt
          ls -lh artifacts

      - name: Upload V8 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-car-automation-v8.0.0-debug-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
